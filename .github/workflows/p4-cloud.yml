name: P4 virtual to physical address and supplied memory tools
on:
  workflow_dispatch:
  push:
    paths:
      - 'p4/**'
      - '.github/workflows/p4-cloud.yml'
permissions:
  contents: read
jobs:
  p4-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DEBIAN_FRONTEND: noninteractive
      P4_BUILD_DIR: /tmp/p4-build
      P4_RESULTS: ${{ github.workspace }}/p4-results
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: |
          for script in p4/*.sh; do bash -n "$script"; done
          sh -n p4/guest/init
      - name: Build matching kernel and both supplied tools
        run: bash p4/build.sh
      - name: Capture real per-level page-table and RAM results
        run: bash p4/screens.sh
      - name: Upload ten terminal screenshots
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: P4-screenshots-${{ github.run_id }}
          retention-days: 21
          if-no-files-found: error
          path: p4-results/screenshots/*.png
      - name: Preserve source configuration and real execution logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: P4-evidence-${{ github.run_id }}
          retention-days: 21
          if-no-files-found: warn
          path: |
            p4-results/logs/
            p4-results/config/
            p4-results/module/
            p4-results/source/
